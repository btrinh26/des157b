<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Phone Screentime</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

</html>
<body>
  <div id="container">
    <h1>Weekly Phone Screentime (4/11-4/18)</h1>
    
    <div class="grid">
      <div class="card">
        <h2>Friday</h2>
        <p class="date">4/11</p>
        <p class="duration">3h 27m</p>
      </div>

      <div class="card">
        <h2>Saturday</h2>
        <p class="date">4/12</p>
        <p class="duration">2h 29m</p>
      </div>

      <div class="card">
        <h2>Sunday</h2>
        <p class="date">4/13</p>
        <p class="duration">8h 13m</p>
      </div>

      <div class="card">
        <h2>Monday</h2>
        <p class="date">4/14</p>
        <p class="duration">2h 58m</p>
      </div>

      <div class="card">
        <h2>Tuesday</h2>
        <p class="date">4/15</p>
        <p class="duration">5h 22m</p>
      </div>

      <div class="card">
        <h2>Wednesday</h2>
        <p class="date">4/16</p>
        <p class="duration">3h 42m</p>
      </div>

      <div class="card">
        <h2>Thursday</h2>
        <p class="date">4/17</p>
        <p class="duration">5h 01m</p>
      </div>

      <div class="card">
        <h2>Friday</h2>
        <p class="date">4/18</p>
        <p class="duration">4h 34m</p>
      </div>
    </div>

    <h2 id="total">Total Screentime:</h2>
  </div>
</body>
</html>
